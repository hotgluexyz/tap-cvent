send_anonymous_usage_stats: true
project_id: "tap-cvent"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-cvent"
    namespace: "tap_cvent"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: client_id
      label: Client ID
      description: OAuth client ID for the Cvent OAuth app
      sensitive: true

    - name: client_secret
      label: Client Secret
      description: OAuth client secret for the Cvent OAuth app
      sensitive: true

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Initial date to start extracting data from

    - name: api_url
      label: API URL
      description: Base URL for the Cvent API (EMEA accounts use api-platform-eur)

    settings_group_validation:
    - [client_id, client_secret]

    config:
      start_date: 6 months ago
      api_url: https://api-platform.cvent.com/ea

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
